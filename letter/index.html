<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f1e1d3" />
    <title>💌</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f1e1d3;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; outline: none; }
      #veil {
        position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 62%, rgba(90,50,30,0.16) 100%);
      }
      #fade { position: fixed; inset: 0; pointer-events: none; background: #f1e1d3; }
    </style>
  </head>
  <body>
    <div id="veil"></div>
    <div id="fade"></div>
    <script type="module" src="../src/letter/main.js"></script>
  </body>
</html>
