# Sends a short message with one button that opens the gift inside Telegram.
#
# Run it with mode "list" first: it shows who has talked to the bot in the last ~24 hours
# (numbered, with how long ago — never names, because these logs are public). Then run it
# with mode "send" and the number of the person to send to.
#
# Needs the repository secret BOT_TOKEN (from @BotFather).
name: Send the gift button

on:
  workflow_dispatch:
    inputs:
      mode:
        description: list (show who can receive it) or send
        type: choice
        options: [list, send]
        default: list
      pick:
        description: For send — the number from the list
        default: ""
      page:
        description: Which gift the button opens
        type: choice
        options: [letter, musicbox]
        default: letter
      text:
        description: Message text
        default: "شما نامه جدید دارین"
      button:
        description: Button text
        default: "💌"

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: List or send
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MODE: ${{ inputs.mode }}
          PICK: ${{ inputs.pick }}
          PAGE: ${{ inputs.page }}
          TEXT: ${{ inputs.text }}
          BUTTON: ${{ inputs.button }}
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          set -euo pipefail
          api="https://api.telegram.org/bot${BOT_TOKEN}"
          # call the Bot API; on failure print only Telegram's error description
          tg() {
            local method=$1; shift
            local out
            out=$(curl -s "$api/$method" "$@")
            if [ "$(echo "$out" | jq -r '.ok')" != "true" ]; then
              echo "Telegram $method failed: $(echo "$out" | jq -r '.description // "no response"')" >&2
              exit 1
            fi
            echo "$out"
          }
          updates=$(tg getUpdates)
          now=$(date +%s)
          # one row per private chat, most recent first: chat id, last activity, did they press Start
          chats=$(echo "$updates" | jq -c --argjson now "$now" '
            [.result[] | (.message // .edited_message // .my_chat_member) | select(.chat.type == "private")
              | {id: .chat.id, date: .date, start: ((.text // "") | startswith("/start"))}]
            | group_by(.id)
            | map({id: .[0].id, last: (map(.date) | max), start: (map(.start) | any), n: length})
            | sort_by(-.last)')
          count=$(echo "$chats" | jq 'length')
          for id in $(echo "$chats" | jq -r '.[].id'); do echo "::add-mask::$id"; done

          if [ "$MODE" = "list" ]; then
            echo "People who talked to the bot in the last ~24 hours: $count"
            echo "$chats" | jq -r --argjson now "$now" 'to_entries[] |
              "#\(.key + 1) — last activity \(((($now - .value.last) / 3600) | floor))h \(((($now - .value.last) % 3600) / 60 | floor))m ago — pressed Start: \(if .value.start then "yes" else "no" end) — messages: \(.value.n)"'
            exit 0
          fi

          if ! [[ "$PICK" =~ ^[0-9]+$ ]] || [ "$PICK" -lt 1 ] || [ "$PICK" -gt "$count" ]; then
            echo "Pick a number from 1 to $count (run with mode \"list\" first)."
            exit 1
          fi
          chat=$(echo "$chats" | jq -r --argjson i "$((PICK - 1))" '.[$i].id')
          url="$SITE"
          if [ "$PAGE" = "letter" ]; then url="${SITE}letter/"; fi
          # the button opens the gift right inside Telegram; the chat's menu button does too
          tg setChatMenuButton -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg c "$chat" --arg t "$BUTTON" --arg u "$url" '{chat_id:($c|tonumber), menu_button:{type:"web_app",text:$t,web_app:{url:$u}}}')" >/dev/null
          body=$(jq -nc --arg c "$chat" --arg m "$TEXT" --arg t "$BUTTON" --arg u "$url" \
            '{chat_id:$c, text:$m, reply_markup:{inline_keyboard:[[{text:$t, web_app:{url:$u}}]]}}')
          tg sendMessage -H 'Content-Type: application/json' -d "$body" >/dev/null
          echo "Sent to #$PICK."
