<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#16141d" />
    <title>Music Box</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B5%3C/text%3E%3C/svg%3E" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #16141d;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; outline: none; }
      #veil {
        position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 58%, rgba(5,4,10,0.38) 100%);
      }
      #fade {
        position: fixed; inset: 0; pointer-events: none; background: #0c0b10;
      }
    </style>
  </head>
  <body>
    <div id="veil"></div>
    <div id="fade"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
